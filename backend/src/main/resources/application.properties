spring.application.name=backend

# SQL Server - Local Development
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=SuncareClinic;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Do not execute schema initialization
spring.sql.init.mode=never

# Keep migrations disabled for now
spring.flyway.enabled=false

# Reject client-supplied fields such as role or staffId in registration requests.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Avoid logging passwords, bearer tokens or response bodies in development.
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
logging.level.org.springframework.web.method=INFO
logging.level.org.springframework.jdbc.core=INFO
