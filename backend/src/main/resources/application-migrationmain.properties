
# Suncare Clinic - One-time Main Database Migration

spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=SuncareClinic;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.flyway.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=SuncareClinic;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=dbo
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

spring.sql.init.mode=never
